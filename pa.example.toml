[model]
name = "qwen3.7-plus"
# Replace with your official account's regional endpoint if different.
base_url = "https://maas.qianwenaiapi.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
timeout_seconds = 90
max_output_tokens = 4096
enable_thinking = false
# Local OpenAI-compatible model gateway on this machine (loopback only):
# name = "your-gateway-model-id"
# base_url = "http://127.0.0.1:<port>/v1"
# api_key_env = "PA_GATEWAY_KEY"
# effort = "medium"       # work turns
# chat_effort = "low"     # replying to the user (intake)

# Web search (optional). backend = "deepseek" (DeepSeek Search API) or "bailian".
# A desktop instance whose model is DeepSeek official searches with that same key
# automatically; otherwise search uses its own key (key_file is read when the env var is unset).
# [web]
# backend = "bailian"
# api_key_env = "DASHSCOPE_API_KEY"
# key_file = "~/.noyi/search.key"
# task_search_limit = 30
# daily_search_limit = 200

# Optional capability plugins: Python modules exposing plugin(). See docs/module-interfaces.md.
# [plugins]
# modules = ["my_notes"]
