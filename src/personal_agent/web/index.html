<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Personal Agent · 我的助理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23252525'/%3E%3Ctext x='17' y='46' fill='white' font-size='46' font-family='sans-serif'%3Ep%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/style.css">
  <link rel="stylesheet" href="/assets/modules.css">
  <link rel="stylesheet" href="/assets/goals.css">
  <script type="module" src="/assets/app.js"></script>
</head>
<body>
<div id="app" class="app">
  <aside class="sidebar" aria-label="会话导航">
    <div class="brand"><span class="brand-mark">p<span>·</span></span><span>Personal Agent</span><span class="local-tag">本地</span></div>
    <div class="sidebar-tools"><label class="search"><span>⌕</span><input id="search" placeholder="搜索会话与事情" aria-label="搜索会话与事情"></label><button id="new-task" class="icon" title="说一件新事情" aria-label="说一件新事情">＋</button></div>
    <div class="section-label">我的助理 <button id="manage-bots" class="small-link">管理</button><button id="new-room" class="small-link">＋ 新建</button></div>
    <div id="rooms" class="room-list"></div>
    <button id="open-goals" class="goal-nav"><span>◷</span> 正在跟进 <small id="goal-count"></small></button>
    <div class="section-label task-section">最近的事情 <span id="task-count"></span></div>
    <nav id="task-list" aria-label="最近的事情"></nav>
    <div class="sidebar-bottom"><div class="user-avatar">我</div><div><strong>个人工作台</strong><small id="connection">正在连接…</small></div><button id="settings" class="icon" aria-label="设置" title="设置">⚙</button></div>
  </aside>
  <div class="resizer" data-panel="left" role="separator" aria-label="调整导航宽度"></div>
  <main class="main">
    <header class="chat-header"><button id="mobile-nav" class="icon mobile-only" aria-label="打开导航">☰</button><div class="avatar">✳</div><div class="chat-title"><h1 id="room-name">个人助理</h1><p id="header-status">帮你把事情持续管好</p></div><button id="show-details" class="icon" aria-label="显示或隐藏详情" title="详情与资料">☷</button></header>
    <div id="banner" class="banner hidden" role="status"></div>
    <section id="goal-panel" class="goal-panel hidden" aria-label="正在跟进的事情"></section>
    <section id="messages" class="messages" aria-label="对话记录" aria-live="polite"></section>
    <div id="jump-bottom" class="jump hidden"><button>↓ 回到最新消息</button></div>
    <div class="composer-area">
      <div id="task-focus" class="task-focus hidden"></div>
      <form id="composer-form" class="composer">
        <div id="recipient-row" class="recipient-row"><label>发送给 <select id="recipient" aria-label="接收成员"></select></label><span id="audience-note"></span><button id="clear-reply" class="small-link hidden" type="button">取消回复</button></div>
        <div id="attachment-list" class="attachments"></div>
        <textarea id="message-input" rows="2" placeholder="直接说你想做什么，也可以补充、提问，或让我继续跟进…" aria-label="输入消息"></textarea>
        <div class="composer-bottom"><div class="compose-actions"><button id="attach" class="icon" type="button" aria-label="添加资料" title="添加文本资料或图片">＋</button><button id="add-url" class="icon" type="button" aria-label="添加资料网址" title="添加资料网址">↗</button></div><span class="keyboard-hint">Enter 发送 · Shift Enter 换行</span><button id="send" type="submit" class="send" aria-label="发送消息">↑</button></div>
      </form>
      <div class="composer-note"><span id="model-label">Qwen 官网</span><span>进展和成果会留在这里</span></div>
      <input id="file-input" type="file" accept=".txt,.md,.json,.csv,.log,.png,.jpg,.jpeg,.gif,.webp,image/*" multiple hidden>
    </div>
  </main>
  <div class="resizer detail-resizer" data-panel="right" role="separator" aria-label="调整详情宽度"></div>
  <aside id="details" class="details" aria-label="任务详情">
    <div class="detail-tabs" role="tablist"><button id="tab-details" role="tab" aria-selected="true" data-tab="details">详情</button><button id="tab-library" role="tab" aria-selected="false" data-tab="library">资料库 <span id="artifact-count"></span></button><button id="tab-memory" role="tab" aria-selected="false" data-tab="memory">记忆</button><button id="tab-commitments" role="tab" aria-selected="false" data-tab="commitments">承诺 <span id="commitment-count"></span></button></div>
    <div id="detail-content" class="detail-content"></div>
  </aside>
</div>
<div id="toast" class="toast hidden" role="status"></div>
<dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="close-modal" class="icon" aria-label="关闭">×</button></div><div id="modal-content"></div></dialog>
</body></html>
