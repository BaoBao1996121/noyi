[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "noyi"
version = "0.6.0"
description = "A personal AI agent that keeps its word: every promise is logged, every result cites its source."
requires-python = ">=3.11"
dependencies = ["openai>=1.60,<3", "httpx>=0.27,<1", "aiohttp>=3.14.5,<4", "tzdata>=2025.1,<2028"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
noyi-cli = "personal_agent.cli:main"
pa = "personal_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
personal_agent = ["pi_bridge/*.mjs", "pi_bridge/package.json", "pi_bridge/package-lock.json", "web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
